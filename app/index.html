<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>a personal website from sabio</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=National+Park:wght@200..800&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="layout-container__div">
            <div class="introduction__div">
                <div class="badge__div">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-check-big-icon lucide-circle-check-big"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>
                    <p>certified banger (tm)</p>
                </div>
                <h1>hi stalkers! <img src="assets/hi.gif" style="height: 1em; width: auto;"></h1>
                <p>guess what? by visiting this website, you agree to our <a href="not-tos/">terms of conditions</a><img src="assets/shocked.jpg" style="height: 1.313em; width: auto;"></p>
            </div>
            <div class="about-me__div" id="about-me">
                <img src="assets/gunieus_world_record.webp" style="height: 20em; width: auto;">
                <div class="about-me-real__div">
                    <h2>who is this dumbass? <img src="assets/thinking.webp" style="height: 1em; width: auto;"></h2>
                    <p>
                        this living organism is behind the most stupid and pointless projects of all time- we even have a gunies world record!
                    </p>
                </div>
            </div>
            <div class="ate-your-cursor__div" id="ate-your-cursor">
                <h2>ate your cursor!!!!</h2>
                <p>:3 it's mine now</p>
            </div>
            <div class="next-page__div" id="next-page">
                <button>next page</button>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const aboutMe = document.getElementById('about-me');

                const dvdLogo = document.createElement("img");
                dvdLogo.src = "assets/thinking-animated.gif";
                dvdLogo.classList.add('dvd-logo');
                aboutMe.appendChild(dvdLogo);

                let x = 50;
                let y = 50;
                let dx = 2;
                let dy = 2;

                function animate() {
                    const rect = aboutMe.getBoundingClientRect();
                    const maxX = rect.width - dvdLogo.width;
                    const maxY = rect.height - dvdLogo.height;

                    x += dx;
                    y += dy;

                    if (x <= 0 || x >= maxX) {
                        dx *= -1;
                    }

                    if (y <= 0 || y >= maxY) {
                        dy *= -1;
                    }

                    dvdLogo.style.left = x + "px";
                    dvdLogo.style.top = y + "px";

                    requestAnimationFrame(animate);
                }

                dvdLogo.onload = () => {
                    animate();
                };

                const ateYourCursor = document.getElementById("ate-your-cursor");

                function setCatCursor() {
                    const img = new Image();
                    img.src = "assets/silly-cat.jpg";
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        canvas.width = 32;
                        canvas.height = 32;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, 32, 32);
                        const dataURL = canvas.toDataURL("image/png");
                        document.body.style.cursor = `url("${dataURL}"), auto`;
                    }
                }

                if (localStorage.getItem('catCursor') === 'true') {
                    setCatCursor();
                }

                ateYourCursor.addEventListener('mouseenter', () => {
                    if (localStorage.getItem('catCursor') !== 'true') {
                        setCatCursor();
                        localStorage.setItem('catCursor', 'true');
                    }
                });

                const nextPageDiv = document.getElementById('next-page')
                const nextPageBtn = nextPageDiv.querySelector('button');

                const placeholder = document.createElement('div');
                placeholder.style.height = `${nextPageBtn.offsetHeight}px`;
                nextPageDiv.insertBefore(placeholder, nextPageBtn);

                nextPageDiv.style.position = 'relative';

                nextPageBtn.style.position = 'absolute';

                function moveButtonAway() {
                    const divRect = nextPageDiv.getBoundingClientRect();

                    const maxX = divRect.width - nextPageBtn.offsetWidth;
                    const maxY = divRect.height - nextPageBtn.offsetHeight;

                    const randomX = Math.floor(Math.random() * maxX);
                    const randomY = Math.floor(Math.random() * maxY);

                    nextPageBtn.style.position = 'absolute';
                    nextPageBtn.style.left = `${randomX}px`;
                    nextPageBtn.style.top = `${randomY}px`;

                    const taunts = [
                        "nope!",
                        "try again",
                        "caseoh's quicker than you",
                        "nah",
                        "imagine losing to a button",
                        "l bozo",
                        "maybe later",
                        "i left you like your failed date",
                        "lol NO",
                        "too slow",
                        "bye"
                    ];

                    nextPageBtn.textContent = taunts[Math.floor(Math.random() * taunts.length)];
                }

                nextPageDiv.style.position = 'relative';

                nextPageBtn.addEventListener('mouseenter', moveButtonAway);

                nextPageBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    moveButtonAway();
                });
            });
        </script>
    </body>
</html>
